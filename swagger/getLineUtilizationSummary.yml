summary: "Get aggregated line utilization metrics"
description: "This method returns aggregated line utilization metrics from the mybus logging database"
produces:
- "application/json"
parameters:
- in: "header"
  name: "token"
  type: "string"
  required: "true"
- in: "query"
  name: "city"
  type: "string"
  required: "false"
- in: "query"
  name: "routeId"
  type: "string"
  required: "false"
- in: "query"
  name: "fromDate"
  type: "string"
  required: "false"
- in: "query"
  name: "toDate"
  type: "string"
  required: "false"
responses:
  200:
    description: "Summary generated"
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          city:
            type: "string"
          routeId:
            type: "string"
          lineName:
            type: "string"
          direction:
            type: "string"
          eventCount:
            type: "integer"
          observedTripCount:
            type: "integer"
            description: "Distinct non-null trip IDs reported in this group"
          observedVehicleCount:
            type: "integer"
            description: "Distinct non-null vehicle IDs reported in this group"
          boardingSampleCount:
            type: "integer"
            description: "Events with a reported boarding count"
          alightingSampleCount:
            type: "integer"
            description: "Events with a reported alighting count"
          occupancySampleCount:
            type: "integer"
            description: "Events with a reported occupancy value"
          totalBoardings:
            type: "integer"
          totalAlightings:
            type: "integer"
          averageOccupancy:
            type: "number"
          averageOccupancyRate:
            type: "number"
          lastObservedAt:
            type: "string"
  400:
    description: "Invalid filter values"
  409:
    description: "Logging database is not initialized"
  500:
    description: "Service error"

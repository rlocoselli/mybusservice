summary: "Get first and last departure times for a route on a given date"
description: "Returns the first departure time, last departure time, and total trip count for each direction of a route on the specified date."
produces:
- "application/json"
parameters:
- $ref: "#/cities"
- in: "path"
  name: "date"
  type: "string"
  required: true
  description: "Date in YYYYMMDD (or YYYY-MM-DD) format"
- in: "path"
  name: "routeId"
  type: "string"
  required: true
  description: "GTFS route_id"
- in: "header"
  name: "token"
  type: "string"
  required: "true"
- in: "query"
  name: "direction"
  type: "string"
  required: false
  description: "Filter by trip_headsign (direction). If omitted, all directions are returned."
responses:
  200:
    description: "First/last departure per direction"
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          route_id:
            type: "string"
          trip_headsign:
            type: "string"
          first_departure:
            type: "string"
          last_departure:
            type: "string"
          trip_count:
            type: "integer"
  400:
    description: "Invalid date format"

summary: "Assign a hashed password to a user"
description: "This method hashes the password in the application and stores it through a PostgreSQL procedure"
consumes:
- "application/json"
produces:
- "application/json"
parameters:
- in: "header"
  name: "token"
  type: "string"
  required: "true"
- in: "body"
  name: "body"
  required: "true"
  schema:
    type: "object"
    required:
    - "username"
    - "password"
    properties:
      username:
        type: "string"
      password:
        type: "string"
responses:
  200:
    description: "Password assigned"
    schema:
      type: "object"
      properties:
        message:
          type: "string"
        username:
          type: "string"
        passwordHashAlgorithm:
          type: "string"
  400:
    description: "Invalid request payload"
  409:
    description: "Logging database is not initialized"
  500:
    description: "Service error"
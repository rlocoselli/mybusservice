summary: "Get token for API or admin dashboard"
description: "Legacy clients can still send header id, while the admin dashboard uses PostgreSQL app_users with username and password."
produces:
- "application/json"
parameters:
- in: "header"
  name: "id"
  type: "string"
  required: false
- in: "body"
  name: "body"
  required: false
  schema:
    type: "object"
    properties:
      username:
        type: "string"
      password:
        type: "string"
responses:
  200:
    description: "Success"
    schema:
      type: "object"
      properties:
        data:
          type: "object"
        status:
          type: "string"
        message:
          type: "string"
 
  401:
    description: "Could not verify! Login Failed"
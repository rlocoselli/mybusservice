summary: "Export dashboard in PDF"
description: "This method exports a PDF snapshot with KPIs and top metrics from usage and line utilization"
produces:
- "application/pdf"
parameters:
- in: "header"
  name: "token"
  type: "string"
  required: "true"
- in: "query"
  name: "city"
  type: "string"
  required: "false"
- in: "query"
  name: "routeId"
  type: "string"
  required: "false"
- in: "query"
  name: "fromDate"
  type: "string"
  required: "false"
- in: "query"
  name: "toDate"
  type: "string"
  required: "false"
responses:
  200:
    description: "PDF exported"
  400:
    description: "Invalid filter values"
  409:
    description: "Logging database is not initialized"
  500:
    description: "Service error"